packages:
  - packages/metadata
  - packages/utils
  - packages/adapters
  - packages/core
  - packages/dicomImageLoader
  - packages/docs
  - packages/nifti-volume-loader
  - packages/polymorphic-segmentation
  - packages/tools
  - packages/ai
  - packages/codemods
  - packages/labelmap-interpolation
  - addOns/externals/*
  - addOns/local/*

nodeLinker: hoisted
strictPeerDependencies: false
linkWorkspacePackages: true
preferWorkspacePackages: true
minimumReleaseAge: 2880
frozenLockfile: true

overrides:
  '@babel/helper-create-class-features-plugin': 7.28.3
  '@babel/helper-compilation-targets': 7.29.7
  caniuse-lite: 1.0.30001767
  axios: 1.18.1
  buffer: 6.0.3
  node-forge: 1.4.0
  canvas: 3.2.0
  tar-fs: 2.1.4
  body-parser: 1.20.3
  ws: 8.21.0
  # undici <6.27.0 (reached only via lerna > node-gyp) is vulnerable to a
  # WebSocket DoS via fragment count bypass (GHSA-vxpw-j846-p89q).
  'undici@<6.27.0': 6.27.0
  qs: 6.14.1
  lodash: 4.18.1
  tar: 7.5.20
  shelljs: 0.10.0
  rollup: 3.30.0
  serialize-javascript: 7.0.4
  'svgo@>=3.0.0 <3.3.4': 3.3.4
  flatted: 3.4.2
  socket.io-parser: 4.2.7
  handlebars: 4.7.9
  path-to-regexp: 0.1.13
  protobufjs: 7.6.1
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  tmp: 0.2.7
  make-fetch-happen: 15.0.5
  webpack: 5.105.0
  mdast-util-to-hast: 13.2.1
  '@remix-run/router': 1.23.2
  '@types/minimatch': 3.0.5
  shell-quote: 1.10.0
  'minimatch@<3.1.4': 3.1.5
  'minimatch@>=10.0.0 <10.2.3': 10.2.5
  'form-data': 4.0.6
  'vite': 8.0.16
  undici: 6.27.0
  websocket-driver: 0.7.5
  adm-zip: 0.6.0
  # brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp / CVE-2026-13149). The advisory
  # patches three separate branches; each rule is scoped to its own major range
  # so they stay disjoint (an unscoped '<5.0.7' would also catch v1/v2 and force
  # them onto v5). v1 must go to 1.1.16 — 1.1.6 is itself still vulnerable.
  'brace-expansion@<1.1.17': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=3.0.0 <3.0.6': 3.0.6
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  # js-yaml is patched on both major lines: v3 consumers (e.g. gray-matter,
  # which calls the v3-only yaml.safeLoad) stay on a safe v3, while true v4
  # consumers are bumped to 4.3.0. The v4 rule is scoped to the v4 range so it
  # does not catch v3 and force gray-matter onto v4 (breaks Docusaurus builds).
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'linkify-it@<=5.0.1': 5.0.2
  'postcss@<8.5.26': 8.5.26
  'ip-address@<10.5.0': 10.5.0
  'nx@>=20.8.0 <22.7.8': 22.7.8

auditConfig:
  ignoreGhsas:
    # decompress is called only ever decompresses a hash-pinned, hardcoded
    # archive in a dev-only CLI
    - GHSA-mp2f-45pm-3cg9
    # image-size infinite-loop DoS (ICNS / JXL+HEIF parsers). No patched version
    # exists (<=2.0.2 all affected). Only reached via @docusaurus/mdx-loader at
    # docs build time on repo-committed images — never on untrusted input.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # extract-zip is a transitive dependency of puppeteer and is only used in dev
    - GHSA-jmr9-qjv8-65gv
allowBuilds:
  '@swc/core': true
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  nx: false
  protobufjs: true
  puppeteer: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@cornerstonejs/codec-charls@1.2.5'
  - '@cornerstonejs/codec-libjpeg-turbo-8bit@1.2.4'
  - '@cornerstonejs/codec-openjpeg@1.3.2'
  - '@cornerstonejs/codec-openjph@2.4.9'
  - ip-address@10.5.0
