<text x="28" y="199" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">renderViewports(ids)</text>
<text x="28" y="216" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">renderViewport(id)</text>
<text x="28" y="233" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">resize() / destroy() ...</text>
<text x="28" y="250" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve"></text>
<text x="28" y="267" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#c45f00" text-anchor="start" xml:space="preserve">renderFrameOfReference: not here</text>
<text x="28" y="284" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve"></text>
<text x="28" y="301" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">probe: typeof engine.renderFrameOfReference</text>
<text x="28" y="318" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">  6.0: undefined   5.x: undefined</text>
