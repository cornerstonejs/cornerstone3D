<text x="408" y="178" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5f6368" text-anchor="middle" xml:space="preserve">holds</text>
<rect x="440" y="70" width="720" height="220" rx="8" fill="#f7f6f2" stroke="#9aa0a6"/>
<text x="452" y="92" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="start" xml:space="preserve">BaseRenderingEngine (ContextPoolRenderingEngine), BaseRenderingEngine.ts:383</text>
<text x="452" y="114" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">public renderFrameOfReference = (FrameOfReferenceUID: string): void =&gt; {</text>
<text x="452" y="131" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">  const viewports = this._getViewportsAsArray();</text>
<text x="452" y="148" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#c45f00" text-anchor="start" xml:space="preserve">  const viewportIdsWithSameFrameOfReferenceUID = viewports.map((vp) =&gt; {</text>
<text x="452" y="165" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">    if (vp.getFrameOfReferenceUID() === FrameOfReferenceUID) {</text>
<text x="452" y="182" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">      return vp.id;</text>
<text x="452" y="199" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">    }</text>
<text x="452" y="216" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">  });</text>
<text x="452" y="233" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">  this.renderViewports(viewportIdsWithSameFrameOfReferenceUID);</text>
<text x="452" y="250" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">};</text>
<text x="452" y="280" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" xml:space="preserve">map keeps one entry per viewport: a viewport of another frame of reference gives undefined (a filter would drop it).</text>
<rect x="440" y="310" width="720" height="140" rx="8" fill="#fff3e6" stroke="#e8b27a"/>
<text x="452" y="332" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="start" xml:space="preserve">Probe: two viewports, A shows a series of frame bothModesFrame, B an image of another frame.</text>
<text x="452" y="350" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" xml:space="preserve">engine._implementation.renderFrameOfReference('bothModesFrame'), with renderViewports wrapped to record its argument:</text>
<text x="452" y="378" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="start" xml:space="preserve">6.0 HEAD 797b4d670:</text>
<text x="620" y="378" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c45f00" text-anchor="start" xml:space="preserve">renderViewports([v1ForA, undefined])</text>
<text x="452" y="404" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="start" xml:space="preserve">5.x 58914567b:</text>
<text x="620" y="404" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c45f00" text-anchor="start" xml:space="preserve">renderViewports([v1ForA, undefined])</text>
<text x="452" y="434" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" xml:space="preserve">No error was thrown in the 4 animation frames after the call.</text>
<text x="16" y="480" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" xml:space="preserve">Callers: git grep at HEAD finds only the definition (packages, utils, tests). The public facade exposes renderViewports(ids), which an application uses instead.</text>
<text x="16" y="498" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f6368" text-anchor="start" xml:space="preserve">Probe zzV1CoreProbe_test.js "row 96"; logs laneV1/karma/core-cur.log and core-legacy.log.</text>
</svg>