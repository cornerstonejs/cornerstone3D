<text x="28" y="92" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="start" xml:space="preserve">RenderingEngine (public facade)</text>
<text x="28" y="114" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">enableElement(input)</text>
<text x="28" y="131" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">disableElement(id)</text>
<text x="28" y="148" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">setViewports(inputs)</text>
<text x="28" y="165" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#1d1d1f" text-anchor="start" xml:space="preserve">getViewport(id) / getViewports()</text>
