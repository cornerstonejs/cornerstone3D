<text x="16" y="28" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1d1d1f" text-anchor="start" xml:space="preserve">Row 96: renderFrameOfReference is not on the public engine, and it maps other viewports to undefined</text>
<text x="16" y="50" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" text-anchor="start" xml:space="preserve">Code at HEAD 797b4d670 (unchanged since 3.x), and what a karma probe saw when it called the method on the engine behind the facade.</text>
