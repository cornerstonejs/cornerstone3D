  <g id="text_29">
   <text style="fill: #5f6368; font: 8.5px 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(7.2 220.562625)">Measured by lane S5E with karma probes (laneS5E/STATUS.md, section R9; one run each, SwiftShader, not a GPU). A shared volume texture is uploaded again at every switch of context (vtk.js</text>
   <text style="fill: #5f6368; font: 8.5px 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(7.2 229.959375)">Texture.setOpenGLRenderWindow), so spreading doubled the time. Not measured again at 797b4d670.</text>
