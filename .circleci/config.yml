# Use the latest 2.1 version of CircleCI pipeline processing engine, see https://circleci.com/docs/2.0/configuration-reference/
version: 2.1

defaults: &defaults
  working_directory: ~/repo
  # https://circleci.com/docs/2.0/circleci-images/#language-image-variants
  docker:
    - image: cimg/node:24.15.0-browsers
      environment:
        TERM: xterm # Enable colors in term

commands:
  install_pnpm:
    steps:
      - run:
          name: Install pnpm
          command: |
            sudo corepack enable
            pnpm --version

jobs:
  CHECKOUT:
    <<: *defaults
    steps:
      - checkout
      # No npm token here: this pipeline only installs and builds PRs.
      # Packages are published from GitHub Actions (publish.yml) with trusted
      # publishing.
      - install_pnpm
      # The dependency audit is the GitHub "Dependency Audit" workflow
      # (.github/workflows/dependency-audit.yml).
      - run: pnpm install --frozen-lockfile
      - persist_to_workspace:
          root: ~/repo
          paths:
            - '.'

  BUILD:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/repo
      - install_pnpm
      - run:
          name: 'Perform the versioning before build'
          command: node ./version.mjs
      - run: pnpm run build
      - persist_to_workspace:
          root: ~/repo
          paths:
            - packages/metadata/dist
            - packages/core/dist
            - packages/tools/dist
            - packages/adapters/dist
            - packages/dicomImageLoader/dist
            - packages/nifti-volume-loader/dist
            - version.txt
            - commit.txt
            - version.json

workflows:
  version: 2

  # PULL REQUEST
  PULL_REQUEST:
    jobs:
      - CHECKOUT:
          filters:
            branches:
              ignore:
                - main
                - feature/*
                - hotfix/*
      - BUILD:
          requires:
            - CHECKOUT

