name: Docusaurus Build

# Builds the documentation and the examples for every pull request, and uploads
# the result as an artifact.
#
# A pull request whose branch lives in this repository also gets its preview
# from this workflow, in the steps at the end. That path is the fast one: the
# author sees the preview at the end of this run, without a second run.
#
# A fork pull request cannot take that path. GitHub passes no secret to a run
# from a fork, so the deploy step below is guarded and skips. docs-preview-
# deploy.yml publishes the artifact of such a run instead, in a second
# workflow that holds the secrets.
#
# Both paths call scripts/ci/docs-preview-publish.sh, so the deploy, the
# comment and the status have one implementation.

on:
  pull_request:
    branches: [ main ]

env:
  ACTIONS_STEP_DEBUG: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docusaurus-build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # The two write scopes serve the publish step at the end, and nothing else.
    # GitHub caps the token of a fork pull request at read-only whatever this
    # block asks for, so on a fork run these two scopes have no effect. The
    # guard on the publish step is what keeps a fork run out of that step; the
    # scopes are not a second guard.
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages in ESM format
        run: pnpm run build:esm

      - name: Build Docusaurus documentation
        run: pnpm --filter docs run build:ci
        env:
          NODE_OPTIONS: --max_old_space_size=32384

      # docs-preview-deploy.yml reads this artifact for a fork pull request. It
      # matches the name on the prefix `docusaurus-build-`, so a change to the
      # name must keep that prefix.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: docusaurus-build-${{ github.sha }}
          path: packages/docs/build/
          retention-days: 7

      # The fast path, for a pull request whose branch lives in this repository.
      # continue-on-error keeps this job a report on the documentation build:
      # the build steps above carry no such flag, so a build that fails still
      # fails the job, and an outage at Netlify does not.
      - name: Publish the preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: bash scripts/ci/docs-preview-publish.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_DIR: ${{ github.workspace }}/packages/docs/build
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
