name: Docusaurus Build

# Stage one of the documentation preview. This workflow builds the
# documentation and the examples of the pull request, and it uploads the result
# as an artifact. It does not publish the result.
#
# docs-preview-deploy.yml is stage two. That workflow runs after this one, it
# downloads the artifact, and it publishes the artifact to Netlify.
#
# The split exists so that this workflow needs no secret and no token that can
# write. This workflow builds the code of the pull request, and the code of a
# fork pull request is untrusted. Please keep the permissions below as they
# are, and add a publish step to stage two instead of to this workflow.

on:
  pull_request:
    branches: [ main ]

env:
  ACTIONS_STEP_DEBUG: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docusaurus-build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages in ESM format
        run: pnpm run build:esm

      - name: Build Docusaurus documentation
        run: pnpm --filter docs run build:ci
        env:
          NODE_OPTIONS: --max_old_space_size=32384

      # Stage two reads this artifact. It matches the name on the prefix
      # `docusaurus-build-`, so a change to the name must keep that prefix.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: docusaurus-build-${{ github.sha }}
          path: packages/docs/build/
          retention-days: 7
