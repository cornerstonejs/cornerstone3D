name: Run Unit Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The PR's copy of the dependency-audit script. The Dependency Audit
      # workflow always runs main's copy, so changes are tested here.
      - name: Dependency audit script tests
        working-directory: scripts/ci/dependency-audit
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test

      - name: Run unit tests (Jest)
        run: pnpm run test:unit
        env:
          JUNIT_REPORT_PATH: ./junit/
          JUNIT_REPORT_NAME: test-results.xml

      # Runs only if the unit tests above passed, so a failure here clearly
      # means the Karma tests failed (not the unit tests).
      - name: Run Karma tests
        run: pnpm run test:ci
        env:
          JUNIT_REPORT_PATH: ./junit/
          JUNIT_REPORT_NAME: test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: always() # Upload even if the test step fails
        with:
          name: test-results
          path: ./junit/

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        if: always() # Upload even if the test step fails
        with:
          name: coverage-report
          path: ./coverage/
