name: OHIF Downstream Validation

# Pull requests: add a line to the PR body, same style as OHIF uses for CS3D_REF:
#   OHIF_REF: <branch-or-tag>
# If omitted, Viewers ref defaults to master. workflow_dispatch can set ohif_ref instead.
on:
  pull_request:
    # Bounded to real base branches. Unfiltered, this ran for a PR against any
    # branch in the repo — pointless runs on a box three repos share, and it
    # weakens the runner-side workflow check, which compares a fork PR's
    # workflow against the copy on whatever branch the PR targets. That
    # comparison only means something when the target is a branch that cannot
    # be casually pushed to.
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      ohif_ref:
        description: >-
          OHIF Viewers branch or tag (e.g. master, beta). On pull_request you can instead add
          a line "OHIF_REF: <ref>" to the PR body.
        required: false
        default: 'master'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Metadata-only gate on a hosted VM: it never checks out or executes PR code.
  # Fork PRs that modify CI-defining files are not dispatched to the shared
  # self-hosted "nashua" box; they run once the change has been reviewed and
  # merged. Same-repo PRs always proceed — the branch lives in this repo, so
  # someone with write access pushed it.
  #
  # The protected-path list below is duplicated in the `gate` job of
  # playwright.yml and in .github/CODEOWNERS, and must be kept in sync by hand:
  # separate workflow files cannot share code. Editing one without the others
  # fails silently.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: decide
        name: Decide whether this PR may run on the self-hosted runner
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Whether the PR branch lives in this repo. If it does, someone with
          # write access pushed it — a fact, unlike anything derivable from the
          # author's identity. Do NOT substitute
          # `github.event.pull_request.author_association`: it does not track
          # repo access in either direction — its MEMBER value only means
          # "member of the owning org" (no write implied), and a repo admin can
          # report CONTRIBUTOR. There is no reliable alternative from inside a
          # fork PR's run either: the authoritative collaborator-permission API
          # needs a token with push access, and fork PRs get a read-only one.
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request ($EVENT_NAME): proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          count=$(wc -l <<<"$files")

          # CI-defining paths: the workflows themselves, the scripts they exec
          # on the nashua box, and the root manifests that steer what gets
          # installed and run there (a modified lockfile can pull a package
          # whose install scripts execute on the box).
          ci_touched=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/*|scripts/ci/*|scripts/run-playright.sh|scripts/link-ohif-cornerstone-node-modules.mjs|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                ci_touched=true ;;
            esac
          done <<<"$files"
          # The list endpoint caps at 3000 files; past that we cannot see every
          # path, so treat the PR as CI-touching.
          if [ "$count" -ge 3000 ]; then ci_touched=true; fi

          if [ "$ci_touched" = true ] && [ "$IS_SAME_REPO" != "true" ]; then
            echo "::notice::OHIF downstream validation deferred: this PR changes CI-defining files and comes from a fork. It will run on the self-hosted runner once the change is reviewed and merged."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  ohif-downstream:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    name: OHIF downstream tests against this PR
    runs-on: [nashua]
    timeout-minutes: 120
    env:
      NODE_VERSION: 24.15.0
      OHIF_REF: master
      OHIF_DIR: ohif
      # Update to force a rebuild of the OHIF integration
      BUILD_INDEX: 0
    steps:
      # Actions are pinned to a commit SHA, not a tag: this job runs on a
      # shared, persistent, self-hosted box, and a tag can be moved by whoever
      # controls the upstream repo. The trailing comment records the tag the SHA
      # corresponds to. Bumping one means resolving the new tag to its commit
      # (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, dereferencing the
      # annotated tag) and updating both the SHA and the comment.
      - name: Checkout Cornerstone
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve OHIF ref (PR body OHIF_REF line or workflow_dispatch input)
        run: bash scripts/ci/ohif-ref-resolve.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OHIF_REF_INPUT: ${{ github.event.inputs.ohif_ref }}
          DEFAULT_REF: master

      # OHIF_REF is read as a shell variable ($OHIF_REF), never interpolated as
      # ${{ env.OHIF_REF }}: its value comes from the PR body (see the resolve
      # step above), and GitHub pastes ${{ }} in as literal text before the
      # shell exists — so punctuation in the value would become program
      # structure and execute here on the nashua box. The shell expands
      # $OHIF_REF only after parsing the command line, so it can only ever be
      # data. The github.* values below are GitHub-supplied and not PR-settable,
      # so they stay as expressions.
      - name: Log build context (OHIF/CS3D branch and version for build diagnosis)
        run: |
          echo "::notice::Build type: ohif-downstream | CS3D: ${{ github.repository }}@${{ github.ref }} (${{ github.sha }}) | OHIF ref: ${OHIF_REF}"
          CS3D_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          CS3D_SHA=$(git rev-parse --short HEAD)
          echo "[build-context] ═══════════════════════════════════════════════════════════════"
          echo "[build-context] Build type: ohif-downstream (CS3D repo validating against OHIF)"
          echo "[build-context] CS3D branch: $CS3D_BRANCH | CS3D SHA: $CS3D_SHA"
          echo "[build-context] OHIF ref: ${OHIF_REF}"
          echo "[build-context] ═══════════════════════════════════════════════════════════════"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No `cache: pnpm`: setup-node resolves the store path by running
          # pnpm, which does not exist until the Corepack step below.

      # pnpm comes from Corepack, not pnpm/action-setup, and scoped to `pnpm` —
      # see the note in playwright.yml. Must run AFTER setup-node, so it is that
      # Node's Corepack.
      - name: Enable Corepack (pnpm)
        shell: bash
        run: |
          corepack enable pnpm
          corepack prepare --activate
          pnpm --version

      - name: Install Cornerstone dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local Cornerstone packages for OHIF (includes metadata)
        run: pnpm run build:esm

      - name: Checkout OHIF
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: OHIF/Viewers
          ref: ${{ env.OHIF_REF }}
          path: ${{ env.OHIF_DIR }}
          fetch-depth: 1
          submodules: recursive

      - name: Log build context (OHIF/CS3D branch and version for build diagnosis)
        run: |
          CS3D_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          CS3D_SHA=$(git rev-parse HEAD)
          OHIF_BRANCH=$(git -C "${OHIF_DIR}" rev-parse --abbrev-ref HEAD)
          OHIF_SHA=$(git -C "${OHIF_DIR}" rev-parse HEAD)
          echo "::notice::Build type: ohif-downstream | OHIF: OHIF/Viewers@${OHIF_BRANCH} (${OHIF_SHA}) | CS3D: ${{ github.repository }}@${CS3D_BRANCH} (${CS3D_SHA})"
          echo "[build-context] ═══════════════════════════════════════════════════════════════"
          echo "[build-context] Build type: ohif-downstream (CS3D repo validating against OHIF)"
          echo "[build-context] OHIF checkout: ${OHIF_BRANCH} (${OHIF_SHA}) | CS3D checkout: ${CS3D_BRANCH} (${CS3D_SHA})"
          echo "[build-context] ═══════════════════════════════════════════════════════════════"

      # OHIF is a pnpm project (OHIF/Viewers#6031), so it is installed with the
      # same Corepack pnpm shim as this repo. Corepack reads `packageManager`
      # from the nearest package.json, so inside $OHIF_DIR it runs the pnpm
      # version OHIF pins, even if that ever differs from this repo's. OHIF's own
      # pnpm-workspace.yaml in $OHIF_DIR is what keeps its install separate from
      # this repo's workspace: pnpm treats the nearest workspace file as the root
      # and never looks further up. --frozen-lockfile installs exactly the
      # versions OHIF ships and honours its minimumReleaseAge quarantine;
      - name: Install OHIF dependencies
        working-directory: ${{ env.OHIF_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Link local Cornerstone packages into OHIF node_modules
        run: node scripts/link-ohif-cornerstone-node-modules.mjs "$OHIF_DIR"

      - name: Run OHIF unit tests
        working-directory: ${{ env.OHIF_DIR }}
        run: pnpm run test:unit:ci

      - name: Install Playwright browsers
        working-directory: ${{ env.OHIF_DIR }}
        run: pnpm exec playwright install chromium

      - name: Run OHIF e2e tests
        working-directory: ${{ env.OHIF_DIR }}
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bash "$GITHUB_WORKSPACE/scripts/ci/with-nashua-lock.sh" pnpm run test:e2e:ci

      - name: Upload OHIF Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ohif-playwright-artifacts-${{ github.sha }}
          path: |
            ${{ env.OHIF_DIR }}/tests/playwright-report.json
            ${{ env.OHIF_DIR }}/tests/playwright-report/
            ${{ env.OHIF_DIR }}/tests/test-results/
          retention-days: 7
