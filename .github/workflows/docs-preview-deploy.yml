name: Deploy Docs Preview

# Stage two of the documentation preview. Stage one is docusaurus-build.yml,
# which builds the documentation and the examples for every pull request and
# uploads the result as an artifact. Stage one gets no secret and a read-only
# token, because it builds the code of the pull request, and the code of a fork
# pull request is untrusted.
#
# This workflow runs after stage one, in the context of this repository, so it
# holds the Netlify secrets and a token that can write. It publishes the
# artifact of stage one. Because of the split, a fork pull request gets a
# preview, which the guard in stage one alone cannot give it.
#
# Three rules keep the split safe, and a change to this file must keep all
# three:
#
#  1. This workflow never runs code that comes from the pull request. It
#     downloads static files and uploads the same static files to Netlify. The
#     flag --no-build is part of that rule, because it stops netlify-cli from
#     running a build command of the site.
#  2. This workflow reads no value out of the artifact. Every value that it uses
#     comes from the `workflow_run` payload, which GitHub writes.
#  3. GitHub runs a `workflow_run` workflow from the default branch only. A fork
#     pull request therefore cannot change this file. A change to this file
#     takes effect after the merge to `main`, and not before.
#
# A value of the payload can still hold text that an author of a fork chose,
# for example the name of a branch. Every step below passes such a value
# through `env:` and reads it as a shell variable. No step writes such a value
# into a `${{ }}` expression inside a `run:` block, because GitHub pastes the
# text of an expression into the script before a shell exists. This is the same
# rule that ohif-downstream.yml states at greater length.

on:
  workflow_run:
    workflows: ['Docusaurus Build']
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # The largest artifact that this workflow publishes, in megabytes. A full
  # build is about 250 MB, of which ort/ is 136 MB and dicom-microscopy-viewer/
  # is 20 MB. The limit leaves room for growth, and it stops a pull request that
  # makes the build write an enormous file.
  MAX_ARTIFACT_MB: 1024

jobs:
  deploy:
    name: Deploy the preview of the pull request
    # A run of stage one that failed carries a partial artifact, because the
    # upload step of stage one runs with `if: always()`. Publish a build that
    # succeeded only.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # read and download the artifact of the run of stage one
      pull-requests: write # write the comment
      statuses: write # write the row of the checks list

    steps:
      # The `pull_requests` array of a `workflow_run` payload is empty for a
      # fork pull request, so this step asks the API instead. The head
      # repository and the head branch identify the pull request, and GitHub
      # supplies both. The answer passes a test for digits before any later
      # step uses the answer in a URL or in an alias.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api \
            -X GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq '[.[].number] | first // empty')

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open") | .number] | first // empty')
          fi

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::warning::No open pull request matches $HEAD_OWNER:$HEAD_BRANCH ($HEAD_SHA). The preview is absent."
            exit 0
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice::The preview belongs to pull request #${PR_NUMBER}."

      # Ask for the size before the download, so an enormous artifact costs a
      # single API call and not the transfer.
      - name: Check the size of the artifact
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # No --paginate: a run of stage one uploads one artifact, and one page
          # holds it. With --paginate, gh applies the filter to each page, and a
          # sum of the first page alone would understate the total.
          BYTES=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name // "") | startswith("docusaurus-build-")) | .size_in_bytes] | add // 0')
          MB=$(( BYTES / 1048576 ))
          echo "The artifact of the build is ${MB} MB."
          if [ "$MB" -gt "$MAX_ARTIFACT_MB" ]; then
            echo "::error::The artifact is ${MB} MB, and the limit is ${MAX_ARTIFACT_MB} MB. The preview is absent."
            exit 1
          fi

      # The name of the artifact of stage one holds `github.sha`, which is the
      # merge commit of the pull request. This workflow knows the head commit
      # and not the merge commit, so it matches on the prefix of the name.
      - name: Download the documentation build
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: docusaurus-build-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: site

      - name: Deploy the preview to Netlify
        id: deploy
        if: steps.pr.outputs.number != ''
        # This job checks out no repository, so netlify-cli finds no pnpm
        # workspace and needs no --filter. The production deploy in
        # build-docs.yml explains the other flags. The pinned version matches
        # build-docs.yml and docusaurus-build.yml.
        run: |
          set -euo pipefail
          test -f site/index.html || {
            echo "::error::The artifact holds no index.html. The preview is absent."
            exit 1
          }
          RESULT=$(npx -y netlify-cli@27.5.2 deploy \
            --no-build \
            --dir="$GITHUB_WORKSPACE/site" \
            --alias="pr-${PR_NUMBER}" \
            --json)
          URL=$(jq -r '.deploy_url' <<<"$RESULT")
          if [[ -z "$URL" || "$URL" == "null" ]]; then
            echo "::error::The Netlify deploy returned no URL."
            echo "$RESULT"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Preview"
            echo
            echo "| Target | URL |"
            echo "| --- | --- |"
            echo "| Documentation | ${URL} |"
            echo "| Examples | ${URL}/live-examples/ |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      # One comment for each pull request. The marker identifies the comment
      # that this workflow wrote, and each later push edits that comment instead
      # of adding another one.
      - name: Comment the preview links on the pull request
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- cs3d-docs-preview -->'
          BODY=$(printf '%s\n### Documentation preview for %s\n\n| Target | URL |\n| --- | --- |\n| Documentation | %s |\n| Examples | %s/live-examples/ |\n' \
            "$MARKER" "${HEAD_SHA:0:7}" "$URL" "$URL")

          COMMENT_ID=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select((.body // \"\") | startswith(\"$MARKER\")) | .id] | first // empty" \
            | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi

      # A commit status adds a row to the checks list of the pull request, and
      # the Details link of that row opens the preview. The run of this workflow
      # does not appear in that list, because the run belongs to a
      # `workflow_run` event, so without this row a reader of the pull request
      # sees nothing of this workflow at all.
      - name: Add the preview to the checks list
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f context='preview/docs' \
            -f description='The documentation and the examples preview' \
            -f target_url="$URL"

      # Without this step a failure of this workflow is invisible on the pull
      # request, for the reason that the step above gives. The row reports the
      # failure and links to the run. The row is advisory: it does not block a
      # merge unless somebody makes `preview/docs` a required check.
      - name: Report a failed preview on the checks list
        if: failure() && steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=error \
            -f context='preview/docs' \
            -f description='The preview deploy failed. Open Details for the log.' \
            -f target_url="$RUN_URL"
