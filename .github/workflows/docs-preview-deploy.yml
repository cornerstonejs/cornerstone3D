name: Deploy Docs Preview

# Publishes the documentation preview of a FORK pull request.
#
# docusaurus-build.yml builds the documentation for every pull request. A pull
# request whose branch lives in this repository also publishes its own preview
# there, in the same run. A fork pull request cannot, because GitHub passes no
# secret to a run from a fork. This workflow closes that gap: it starts after
# the build, in the context of this repository, so it holds the Netlify secrets
# and a token that can write.
#
# Four rules keep this safe, and a change to this file must keep all four:
#
#  1. This workflow never runs code of the pull request. It downloads static
#     files and uploads the same static files. The flag --no-build in
#     scripts/ci/docs-preview-publish.sh is part of this rule, because the flag
#     stops netlify-cli from running a build command of the site.
#  2. This workflow reads no value out of the artifact. Every value comes from
#     the `workflow_run` payload, which GitHub writes.
#  3. The checkout below takes the DEFAULT BRANCH, and never the code of the
#     pull request. The script that this workflow runs therefore comes from
#     `main` and not from the fork.
#  4. GitHub runs a `workflow_run` workflow from the default branch only, so a
#     fork pull request cannot change this file.
#
# A value of the payload can still hold text that an author of a fork chose,
# for example the name of a branch. Every step below passes such a value
# through `env:` and reads it as a shell variable. No step writes such a value
# into a `${{ }}` expression inside a `run:` block, because GitHub pastes the
# text of an expression into the script before a shell exists. This is the same
# rule that ohif-downstream.yml states at greater length.

on:
  workflow_run:
    workflows: ['Docusaurus Build']
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  # The largest artifact that this workflow publishes, in megabytes. A normal
  # build is about 95 MB. The limit leaves room for growth, and it stops a fork
  # pull request that makes the build write an enormous file.
  MAX_ARTIFACT_MB: 1024

jobs:
  deploy:
    name: Publish the preview of a fork pull request
    # Three conditions, and each one matters:
    #   - a pull request, and not a push;
    #   - a build that succeeded, because the upload step of the build runs with
    #     `if: always()` and a failed build leaves a partial artifact;
    #   - a fork, because docusaurus-build.yml already published the preview of
    #     a pull request whose branch lives in this repository.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # read and download the artifact of the build
      pull-requests: write # write the comment
      statuses: write # write the row of the checks list

    steps:
      # Rule 3. `ref` names the default branch, so this brings the trusted copy
      # of the publish script and never the code of the fork. sparse-checkout
      # keeps the checkout to the one directory that this workflow runs.
      - name: Checkout the publish script from the default branch
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # The `pull_requests` array of a `workflow_run` payload is empty for a
      # fork pull request, so this step asks the API. The head repository and
      # the head branch identify the pull request, and GitHub supplies both.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api \
            -X GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$HEAD_OWNER:$HEAD_BRANCH" \
            --jq '[.[].number] | first // empty')

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open") | .number] | first // empty')
          fi

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::warning::No open pull request matches $HEAD_OWNER:$HEAD_BRANCH ($HEAD_SHA). The preview is absent."
            exit 0
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "::notice::The preview belongs to pull request #${PR_NUMBER}."

      # Ask for the size before the download, so an enormous artifact costs one
      # API call and not the transfer.
      - name: Check the size of the artifact
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # No --paginate: a build uploads one artifact, and one page holds it.
          # With --paginate, gh applies the filter to each page, and a sum of the
          # first page alone would understate the total.
          BYTES=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select((.name // "") | startswith("docusaurus-build-")) | .size_in_bytes] | add // 0')
          MB=$(( BYTES / 1048576 ))
          echo "The artifact of the build is ${MB} MB."
          if [ "$MB" -gt "$MAX_ARTIFACT_MB" ]; then
            echo "::error::The artifact is ${MB} MB, and the limit is ${MAX_ARTIFACT_MB} MB. The preview is absent."
            exit 1
          fi

      # The name of the artifact holds `github.sha`, which is the merge commit
      # of the pull request. This workflow knows the head commit and not the
      # merge commit, so it matches on the prefix of the name.
      - name: Download the documentation build
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: docusaurus-build-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: site

      - name: Publish the preview
        if: steps.pr.outputs.number != ''
        run: bash scripts/ci/docs-preview-publish.sh
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH_DIR: ${{ github.workspace }}/site
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      # A run of this workflow does not appear in the checks list of the pull
      # request, because the run belongs to a `workflow_run` event. Without this
      # step a failure here is invisible to a reader of the pull request. The
      # row is advisory: it blocks no merge unless somebody makes `preview/docs`
      # a required check.
      - name: Report a failed preview on the checks list
        if: failure() && steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=error \
            -f context='preview/docs' \
            -f description='The preview deploy failed. Open Details for the log.' \
            -f target_url="$RUN_URL"
