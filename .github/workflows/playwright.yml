name: Playwright Tests
on:
  pull_request:
    # Real base branches only. `master` was listed here but does not exist in
    # this repo, so it never matched — and had one ever been created, this job
    # would have started running on the shared self-hosted box against it with
    # nobody having decided that.
    branches: [main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Metadata-only gate on a hosted VM: it never checks out or executes PR code.
  # Fork PRs that modify CI-defining files are not dispatched to the shared
  # self-hosted "nashua" box; they run once the change has been reviewed and
  # merged. Same-repo PRs always proceed — the branch lives in this repo, so
  # someone with write access pushed it.
  #
  # The protected-path list below is duplicated in the `gate` job of
  # ohif-downstream.yml and in .github/CODEOWNERS, and must be kept in sync by
  # hand: separate workflow files cannot share code. Editing one without the
  # others fails silently.
  #
  # This job is part of the workflow it protects: a fork PR can delete it, along
  # with the `needs:` and `if:` below, and dispatch straight to the box. What
  # stops that is a repository setting —
  # `actions/permissions/fork-pr-contributor-approval` set to
  # `all_external_contributors`, so a maintainer approves every fork PR run.
  # Relaxing it removes that barrier silently, so treat it as part of this file.
  #
  # This job's value is catching an approval given without full attention, not a
  # deliberate attacker, who deletes it. Other layers exist outside this
  # repository; this is not the last line of defence.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list the PR's changed files
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: decide
        name: Decide whether this PR may run on the self-hosted runner
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Whether the PR branch lives in this repo. If it does, someone with
          # write access pushed it — a fact, unlike anything derivable from the
          # author's identity. Do NOT substitute
          # `github.event.pull_request.author_association`: it does not track
          # repo access in either direction — its MEMBER value only means
          # "member of the owning org" (no write implied), and a repo admin can
          # report CONTRIBUTOR. There is no reliable alternative from inside a
          # fork PR's run either: the authoritative collaborator-permission API
          # needs a token with push access, and fork PRs get a read-only one.
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request ($EVENT_NAME): proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          count=$(wc -l <<<"$files")

          # CI-defining paths: the workflows themselves, the scripts they exec
          # on the nashua box, and the root manifests that steer what gets
          # installed and run there (a modified lockfile can pull a package
          # whose install scripts execute on the box).
          ci_touched=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # Workflows, and the scripts they exec on the box.
              .github/*|scripts/ci/*|scripts/run-playwright.sh|scripts/link-ohif-cornerstone-node-modules.mjs)
                ci_touched=true ;;
              # The install surface. package.json declares `preinstall`, and pnpm
              # executes a root pnpmfile, so editing either runs code on the box
              # during `pnpm install`. The lockfile and workspace file steer what
              # gets installed and can undo the release-age quarantine; .npmrc can
              # repoint the registry. Most of these are untracked today — that is
              # the point: a fork can ADD one, and a list of only existing files
              # would not notice.
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|preinstall.js|.npmrc)
                ci_touched=true ;;
              .pnpmfile.mjs|.pnpmfile.cjs|pnpmfile.mjs|pnpmfile.cjs)
                ci_touched=true ;;
            esac
          done <<<"$files"
          # The list endpoint caps at 3000 files; past that we cannot see every
          # path, so treat the PR as CI-touching.
          if [ "$count" -ge 3000 ]; then ci_touched=true; fi

          if [ "$ci_touched" = true ] && [ "$IS_SAME_REPO" != "true" ]; then
            echo "::notice::Playwright deferred: this PR changes CI-defining files and comes from a fork. It will run on the self-hosted runner once the change is reviewed and merged."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

  playwright-tests:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    timeout-minutes: 120
    runs-on: [nashua]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - node-version: 24.15.0
            mode: legacy
            run_args: '--project=chromium'
            collect_coverage: true
          - node-version: 24.15.0
            mode: compatibility
            run_args: '--compat --project=chromium'
            collect_coverage: false
          - node-version: 24.15.0
            mode: next
            run_args: '--next --project=chromium'
            collect_coverage: false
    name: Playwright (${{ matrix.mode }})
    steps:
      # Actions are pinned to a commit SHA, not a tag: this job runs on a
      # shared, persistent, self-hosted box, and a tag can be moved by whoever
      # controls the upstream repo. The trailing comment records the tag the SHA
      # corresponds to. Bumping one means resolving the new tag to its commit
      # (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`, dereferencing the
      # annotated tag) and updating both the SHA and the comment.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          # No `cache: pnpm`: setup-node resolves the store path by running
          # pnpm, which does not exist until the Corepack step below.
      # pnpm comes from Corepack, not pnpm/action-setup: that action's
      # self-installer requires a working `npm`, which this runner does not
      # provide. Corepack ships inside Node and reads the pinned
      # `packageManager` from package.json, so it needs no npm. Must run AFTER
      # setup-node, so it is that Node's Corepack. Scoped to `pnpm` — unscoped
      # `corepack enable` would also create yarn/yarnpkg shims that nothing here
      # uses. NOTE: node 25 unbundles corepack; revisit before any such bump.
      - name: Enable Corepack (pnpm)
        shell: bash
        run: |
          corepack enable pnpm
          corepack prepare --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Run Playwright tests
        env:
          CI: true
          COVERAGE: ${{ matrix.collect_coverage && 'true' || '' }}
          PLAYWRIGHT_HTML_OPEN: never
          # Values reaching the `run:` block below are passed through `env:`
          # rather than interpolated as ${{ }}. GitHub pastes ${{ }} in as
          # literal text before the shell exists, so punctuation in a value
          # becomes program structure; the shell expands an env var only after
          # it has parsed the command line, so it can only ever be an argument.
          # These two are workflow-file literals today, so this is hygiene
          # rather than a fix — but it keeps one rule for every such value.
          COLLECT_COVERAGE: ${{ matrix.collect_coverage }}
          RUN_ARGS: ${{ matrix.run_args }}
        run: |
          export NODE_OPTIONS="--max_old_space_size=10192"
          # $RUN_ARGS is deliberately unquoted: it carries several flags
          # (e.g. `--compat --project=chromium`) that must word-split.
          if [ "$COLLECT_COVERAGE" = "true" ]; then
            bash scripts/ci/with-nashua-lock.sh pnpm exec nyc --reporter=html ./scripts/run-playwright.sh $RUN_ARGS
          else
            bash scripts/ci/with-nashua-lock.sh ./scripts/run-playwright.sh $RUN_ARGS
          fi
      - name: Upload Playwright report and test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.sha }}
          if-no-files-found: warn
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7
      - name: create the coverage report
        if: ${{ matrix.collect_coverage }}
        run: |
          pnpm exec nyc report --reporter=lcov --reporter=text
      - name: Upload the coverage report to GitHub Actions Artifacts
        if: ${{ !cancelled() && matrix.collect_coverage }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-pr
          path: coverage
          retention-days: 7
      - name: Upload Playwright reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.mode }}
          path: reports/*playwright
          retention-days: 7
