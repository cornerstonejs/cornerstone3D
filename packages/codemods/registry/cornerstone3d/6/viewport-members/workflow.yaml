version: '1'
nodes:
  - id: viewport-members
    name: Cornerstone3D 6.0 viewport members
    steps:
      - name: Rewrite the viewport members in TypeScript files
        js-ast-grep:
          js_file: scripts/viewport-members.ts
          language: typescript
          base_path: .
          semantic_analysis: file
          include:
            - '**/*.{ts,mts,cts}'
          exclude:
            - '**/node_modules/**'
            - '**/dist/**'
            - '**/build/**'
      - name: Rewrite the viewport members in TSX and JavaScript files
        js-ast-grep:
          js_file: scripts/viewport-members.ts
          language: tsx
          base_path: .
          semantic_analysis: file
          include:
            - '**/*.{tsx,js,jsx,mjs,cjs}'
          exclude:
            - '**/node_modules/**'
            - '**/dist/**'
            - '**/build/**'
