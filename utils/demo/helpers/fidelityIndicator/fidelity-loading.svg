<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15">
  <!-- Loading, animated: amber disc at 30%; the 9 px amber fill shrinks to 1 px over 0.9 s (ease-in t^2.2),
       then springs back over 0.9 s. 1.8 s loop. Same keyframes as fidelity-indicator.css. -->
  <style>
    .dot { transform-box: fill-box; transform-origin: center; animation: fi-loading 1.8s linear infinite; }
    @keyframes fi-loading {
      0% { transform: scale(1); animation-timing-function: cubic-bezier(0.2, 0, 0.57, 0.05); }
      50% { transform: scale(0.1111); animation-timing-function: linear; }
      51.25% { transform: scale(0.2561); }
      52.5% { transform: scale(0.4133); }
      53.75% { transform: scale(0.569); }
      55% { transform: scale(0.7133); }
      56.25% { transform: scale(0.8394); }
      57.5% { transform: scale(0.9435); }
      58.75% { transform: scale(1.0244); }
      60% { transform: scale(1.0826); }
      61.25% { transform: scale(1.1201); }
      62.5% { transform: scale(1.1397); }
      63.75% { transform: scale(1.1447); }
      65% { transform: scale(1.1386); }
      66.25% { transform: scale(1.1247); }
      67.5% { transform: scale(1.1059); }
      68.75% { transform: scale(1.0848); }
      70% { transform: scale(1.0636); }
      71.25% { transform: scale(1.0436); }
      72.5% { transform: scale(1.026); }
      73.75% { transform: scale(1.0114); }
      75% { transform: scale(1); }
      76.25% { transform: scale(0.9918); }
      77.5% { transform: scale(0.9865); }
      78.75% { transform: scale(0.9837); }
      80% { transform: scale(0.9829); }
      81.25% { transform: scale(0.9836); }
      82.5% { transform: scale(0.9854); }
      83.75% { transform: scale(0.9878); }
      85% { transform: scale(0.9904); }
      86.25% { transform: scale(0.9929); }
      87.5% { transform: scale(0.9952); }
      88.75% { transform: scale(0.9972); }
      90% { transform: scale(0.9987); }
      91.25% { transform: scale(0.9997); }
      92.5% { transform: scale(1.0004); }
      93.75% { transform: scale(1.0007); }
      95% { transform: scale(1.0008); }
      96.25% { transform: scale(1.0007); }
      97.5% { transform: scale(1.0005); }
      98.75% { transform: scale(1.0002); }
      100% { transform: scale(1); }
    }
  </style>
  <circle cx="7.5" cy="7.5" r="7.5" fill="#f0a030" fill-opacity="0.3"/>
  <circle class="dot" cx="7.5" cy="7.5" r="4.5" fill="#f0a030"/>
</svg>
